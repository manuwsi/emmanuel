<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  Covers and openings drawn from each project's own idea (not screenshots in rectangles).
  Rendered to images by render.py:  index.html?id=colosse&w=1600&h=1200
  Facts only from the case studies: names, depths, distances and levels are the ones the cases show.
-->
<style>
  @font-face { font-family: GS; src: url(../motion/fonts/GeneralSans-Regular.otf); font-weight: 400; }
  @font-face { font-family: GS; src: url(../motion/fonts/GeneralSans-Medium.otf); font-weight: 500; }
  @font-face { font-family: GM; src: url(../../public/proxy/prototype/fonts/geist-mono-latin-400-normal.woff2); font-weight: 400; }
  @font-face { font-family: GM; src: url(../../public/proxy/prototype/fonts/geist-mono-latin-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: NR; src: url(../../public/proxy/prototype/fonts/newsreader-latin-300-normal.woff2); font-weight: 300; }
  @font-face { font-family: NR; src: url(../../public/proxy/prototype/fonts/newsreader-latin-400-normal.woff2); font-weight: 400; }
  html, body { margin: 0; background: #f1f1ef; }
  #s { position: relative; overflow: hidden; background: #f1f1ef; color: #0a0a0a; font-family: GS, sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<div id="s"></div>
<script>
const q = new URLSearchParams(location.search);
const ID = q.get('id') || 'colosse';
const W = +(q.get('w') || 1600), H = +(q.get('h') || 1200);
const LANG = q.get('lang') || 'fr';
const tr = (fr, en) => (LANG === 'en' ? en : fr);
const S = document.getElementById('s');
S.style.width = W + 'px'; S.style.height = H + 'px';
const INK = '#0a0a0a', RED = '#e3382a', BLUE = '#2f6fd6';

// small seeded random, so the buildings are the same at every render
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

/* ── COLOSSE: the longitudinal section, the line of the present, the void under the school ───── */
function colosse() {
  const street = H * 0.36;
  const m = (H * 0.86 - street) / 22; // px per metre, vertical: the tunnel axis (22 m) sits at 86 % of the height
  const hm = m * 0.62; // px per metre, horizontal (compressed, as on the cockpit's section)
  const front = W * (W / H > 1.45 ? 0.47 : 0.44);
  const y = (d) => street + d * m; // depth in metres -> y
  const axis = y(22), R = 5 * m;
  const voidX = front + 31 * hm, voidY = y(12);
  const fs = Math.round(H * 0.0125 + 2); // label size
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="remb" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="${INK}"/><circle cx="6.5" cy="6.5" r=".8" fill="${INK}" opacity=".6"/></pattern>
    <pattern id="marn" width="18" height="11" patternUnits="userSpaceOnUse"><line x1="1" y1="3" x2="8" y2="3" stroke="${INK}" stroke-width="1"/><line x1="10" y1="8.5" x2="17" y2="8.5" stroke="${INK}" stroke-width="1"/></pattern>
    <pattern id="calc" width="22" height="11" patternUnits="userSpaceOnUse"><line x1="0" y1="10.5" x2="22" y2="10.5" stroke="${INK}" stroke-width=".9"/><line x1="5" y1="0" x2="5" y2="5.2" stroke="${INK}" stroke-width=".9"/><line x1="16" y1="5.5" x2="16" y2="10.5" stroke="${INK}" stroke-width=".9"/><line x1="0" y1="5.3" x2="22" y2="5.3" stroke="${INK}" stroke-width=".55"/></pattern>
    <pattern id="argi" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="${INK}" stroke-width="1"/></pattern>
    <pattern id="void" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${RED}" stroke-width="1.6"/></pattern>
    <pattern id="ring" width="${1.5 * hm}" height="10" patternUnits="userSpaceOnUse"><line x1=".5" y1="0" x2=".5" y2="10" stroke="${INK}" stroke-width="1" opacity=".55"/></pattern>
    <clipPath id="ground"><rect x="0" y="${street}" width="${W}" height="${H - street}"/></clipPath>
  </defs>`;
  // strata (names from the case's legend)
  const layers = [
    ['remb', 0, 3.5, tr('Remblais', 'Fill')],
    ['marn', 3.5, 10, tr('Marnes et caillasses', 'Marl and rubble')],
    ['calc', 10, 18.5, tr('Calcaire grossier', 'Coarse limestone')],
    ['argi', 18.5, 40, tr('Argile plastique', 'Plastic clay')],
  ];
  layers.forEach(([p, a, b]) => { s += `<rect x="0" y="${y(a)}" width="${W}" height="${y(b) - y(a)}" fill="url(#${p})" opacity=".42"/>`; });
  layers.slice(1).forEach(([, a]) => { s += `<line x1="0" y1="${y(a)}" x2="${W}" y2="${y(a)}" stroke="${INK}" stroke-width="1" opacity=".35"/>`; });
  // water table
  s += `<line x1="0" y1="${y(8.2)}" x2="${W}" y2="${y(8.2)}" stroke="${BLUE}" stroke-width="1.6" stroke-dasharray="7 6"/>`;
  // the tunnel already dug, and the machine
  const tail = Math.max(-40, front - 30 * hm);
  s += `<rect x="${tail}" y="${axis - R}" width="${front - tail}" height="${2 * R}" fill="#f1f1ef"/>`;
  s += `<rect x="${tail}" y="${axis - R}" width="${front - tail}" height="${2 * R}" fill="url(#ring)"/>`;
  s += `<rect x="${tail}" y="${axis - R}" width="${front - tail}" height="${2 * R}" fill="none" stroke="${INK}" stroke-width="2"/>`;
  s += `<rect x="${front - 0.8 * hm}" y="${axis - R}" width="${0.8 * hm}" height="${2 * R}" fill="${INK}"/>`;
  s += `<line x1="${tail}" y1="${axis}" x2="${front}" y2="${axis}" stroke="${INK}" stroke-width="1" stroke-dasharray="2 5" opacity=".6"/>`;
  // the void ahead (about 6 m), and the probe reaching it
  const vw = 6 * hm, vh = 2.6 * m;
  s += `<path d="M ${voidX - vw / 2} ${voidY} C ${voidX - vw / 2} ${voidY - vh * 0.7}, ${voidX + vw * 0.2} ${voidY - vh * 0.62}, ${voidX + vw / 2} ${voidY - vh * 0.15} C ${voidX + vw * 0.56} ${voidY + vh * 0.4}, ${voidX - vw * 0.1} ${voidY + vh * 0.62}, ${voidX - vw / 2} ${voidY} Z" fill="url(#void)" stroke="${RED}" stroke-width="2"/>`;
  s += `<line x1="${front + 4}" y1="${axis - R * 0.55}" x2="${voidX - vw / 2 - 6}" y2="${voidY + 4}" stroke="${RED}" stroke-width="1.4" stroke-dasharray="3 6"/>`;
  // buildings along the street, the school right above the void
  seed = 7;
  let x = -20;
  const school = [voidX - 4.6 * hm, voidX + 4.6 * hm];
  while (x < W + 20) {
    let bw = (5 + rnd() * 8) * hm;
    if (x < school[0] && x + bw > school[0] - 6) bw = school[0] - 6 - x;
    if (bw > 18) {
      const bh = (7 + rnd() * 8) * m;
      s += `<rect x="${x}" y="${street - bh}" width="${bw}" height="${bh}" fill="#f1f1ef" stroke="${INK}" stroke-width="1.2"/>`;
      const cols = Math.max(1, Math.floor(bw / (1.6 * hm))), rows = Math.floor(bh / (1.7 * m));
      for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols; c++) {
        const wx = x + (c + 0.5) * (bw / cols) - 0.3 * hm, wy = street - bh + (r + 0.75) * (bh / rows);
        s += `<rect x="${wx}" y="${wy}" width="${0.6 * hm}" height="${0.75 * m}" fill="${INK}" opacity=".42"/>`;
      }
    }
    x += bw + 6;
    if (x >= school[0] - 6 && x < school[1]) {
      const bh = 6.2 * m, sx = school[0], sw = school[1] - school[0];
      s += `<rect x="${sx}" y="${street - bh}" width="${sw}" height="${bh}" fill="#f1f1ef" stroke="${RED}" stroke-width="2"/>`;
      for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) s += `<rect x="${sx + (c + 0.5) * (sw / 5) - 0.45 * hm}" y="${street - bh + (r + 0.6) * (bh / 3)}" width="${0.9 * hm}" height="${1.1 * m}" fill="${RED}" opacity=".8"/>`;
      s += `<text x="${sx + sw / 2}" y="${street - bh - fs * 0.9}" text-anchor="middle" font-family="GM" font-size="${fs}" letter-spacing=".08em" fill="${RED}">${tr('ÉCOLE', 'SCHOOL')}</text>`;
      x = school[1] + 6;
    }
  }
  s += `<line x1="0" y1="${street}" x2="${W}" y2="${street}" stroke="${INK}" stroke-width="2.2"/>`;
  // the line of the present
  const tagW = fs * 15.6, tagH = fs * 2;
  s += `<line x1="${front}" y1="${H * 0.06 + tagH}" x2="${front}" y2="${H}" stroke="${INK}" stroke-width="2"/>`;
  s += `<rect x="${front - tagW / 2}" y="${H * 0.06}" width="${tagW}" height="${tagH}" fill="${INK}"/>`;
  s += `<text x="${front}" y="${H * 0.06 + tagH * 0.66}" text-anchor="middle" font-family="GM" font-weight="500" font-size="${fs}" letter-spacing=".06em" fill="#fff">PK 3+320,4 · ${tr('MAINTENANT', 'NOW')}</text>`;
  // the 31 m to the void
  const dy = y(1.0);
  s += `<g stroke="${RED}" stroke-width="1.6"><line x1="${front}" y1="${dy}" x2="${voidX}" y2="${dy}"/><line x1="${front}" y1="${dy - 8}" x2="${front}" y2="${dy + 8}"/><line x1="${voidX}" y1="${dy - 8}" x2="${voidX}" y2="${dy + 8}"/></g>`;
  s += `<line x1="${voidX}" y1="${dy}" x2="${voidX}" y2="${voidY - vh * 0.62}" stroke="${RED}" stroke-width="1" stroke-dasharray="3 5"/>`;
  s += `<rect x="${(front + voidX) / 2 - fs * 2.3}" y="${dy - fs * 0.85}" width="${fs * 4.6}" height="${fs * 1.7}" fill="#f1f1ef"/>`;
  s += `<text x="${(front + voidX) / 2}" y="${dy + fs * 0.36}" text-anchor="middle" font-family="GM" font-weight="500" font-size="${fs * 1.05}" fill="${RED}">31 m</text>`;
  s += `<text x="${voidX + vw / 2 + 12}" y="${voidY - vh * 0.1}" font-family="GM" font-size="${fs}" letter-spacing=".06em" fill="${RED}">${tr('VIDE PROBABLE', 'PROBABLE VOID')}</text>`;
  s += `<text x="${voidX + vw / 2 + 12}" y="${voidY - vh * 0.1 + fs * 1.45}" font-family="GM" font-size="${fs}" letter-spacing=".06em" fill="${RED}">≈ 6 m</text>`;
  // depth ruler and layer names
  for (let d = 0; d <= 25; d += 5) {
    const yy = y(d);
    s += `<line x1="${W - 22}" y1="${yy}" x2="${W}" y2="${yy}" stroke="${INK}" stroke-width="1.4"/>`;
    s += `<text x="${W - 30}" y="${yy + fs * 0.35}" text-anchor="end" font-family="GM" font-size="${fs}" fill="${INK}" opacity=".7">${d === 0 ? '0' : '−' + d} m</text>`;
  }
  layers.forEach(([, a, b, name]) => {
    const yy = (a === 0 ? y(2.6) : y(a) + Math.min(y(b) - y(a), 4 * m) * 0.5) + fs * 0.35;
    if (yy < H - 10) s += `<text x="${front + 22}" y="${yy}" font-family="GM" font-size="${fs}" letter-spacing=".06em" fill="${INK}" opacity=".75">${name.toUpperCase()}</text>`;
  });
  s += `<text x="${front + 22}" y="${y(8.2) - fs * 0.6}" font-family="GM" font-size="${fs}" letter-spacing=".06em" fill="${BLUE}">${tr('NAPPE', 'WATER TABLE')} −8,2 m</text>`;
  s += `<text x="${tail + 18 > 0 ? tail + 18 : W * 0.025}" y="${axis - R - fs * 0.7}" font-family="GM" font-size="${fs}" letter-spacing=".06em" fill="${INK}" opacity=".8">${tr('YSÉE · AXE −22 m', 'YSÉE · AXIS −22 m')}</text>`;
  s += `</svg>`;
  S.innerHTML = s;
}

/* ── PROXY: trust set domain by domain (the levels of the case's trust line) ─────────────────── */
function proxy() {
  const pad = W * 0.075;
  const mark = [[0, 0, 2, 0, 0], [0, 2, 1, 2, 0], [2, 1, 2, 1, 2], [0, 2, 1, 2, 0], [0, 0, 2, 0, 0]];
  const doms = [
    [tr('Virements', 'Transfers'), 4],
    [tr('Courriels à un nouveau contact', 'Emails to a new contact'), 22],
    [tr('Achats au-dessus de 60 €', 'Purchases over €60'), 40],
    [tr('Agenda', 'Calendar'), 68],
    [tr('Classer des fichiers', 'Filing documents'), 94],
  ];
  const wide = W / H > 1.45;
  const title = H * (wide ? 0.088 : 0.074);
  const cell = H * 0.0125;
  let markSvg = `<svg width="${cell * 5}" height="${cell * 5}" viewBox="0 0 25 25">`;
  mark.forEach((row, yy) => row.forEach((v, xx) => { if (v) markSvg += `<circle cx="${2.5 + xx * 5}" cy="${2.5 + yy * 5}" r="${v === 2 ? 2.3 : 1.5}" fill="${INK}" opacity="${v === 2 ? 1 : 0.55}"/>`; }));
  markSvg += `</svg>`;
  const top = pad * 0.9;
  const scaleTop = H * (wide ? 0.5 : 0.52), rowH = (H - scaleTop - pad * 1.05) / doms.length;
  const labelW = wide ? W * 0.27 : W * 0.33;
  const lineX0 = pad + labelW, lineX1 = W - pad;
  const fs = H * 0.0185, mono = H * 0.0118;
  let h = `<div style="position:absolute;left:${pad}px;top:${top}px">${markSvg}</div>`;
  h += `<div style="position:absolute;left:${pad}px;top:${top + cell * 5 + H * 0.05}px;width:${wide ? W * 0.62 : W - 2 * pad}px;font-family:NR;font-weight:300;font-size:${title}px;line-height:1.04;letter-spacing:-0.015em">${tr('Tu décides jusqu’où Proxy peut aller.', 'You decide how far Proxy can go.')}</div>`;
  let s = `<svg width="${W}" height="${H}" style="position:absolute;inset:0">`;
  // axis labels
  s += `<text x="${lineX0}" y="${scaleTop - rowH * 0.42}" font-family="GM" font-size="${mono}" letter-spacing=".08em" fill="${INK}" opacity=".6">${tr('PROXY DEMANDE TOUT', 'PROXY ASKS FOR EVERYTHING')}</text>`;
  s += `<text x="${lineX1}" y="${scaleTop - rowH * 0.42}" text-anchor="end" font-family="GM" font-size="${mono}" letter-spacing=".08em" fill="${INK}" opacity=".6">${tr('PROXY AGIT EN SILENCE', 'PROXY ACTS SILENTLY')}</text>`;
  doms.forEach(([name, xp], i) => {
    const yy = scaleTop + rowH * (i + 0.5);
    const x0 = lineX0 + (lineX1 - lineX0) * 0.015, x1 = lineX0 + (lineX1 - lineX0) * xp / 100;
    s += `<line x1="${lineX0}" y1="${yy}" x2="${lineX1}" y2="${yy}" stroke="${INK}" stroke-width="1.2" opacity=".18"/>`;
    s += `<line x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}" stroke="${INK}" stroke-width="2"/>`;
    s += `<circle cx="${x0}" cy="${yy}" r="${H * 0.0085}" fill="#f1f1ef" stroke="${INK}" stroke-width="2"/>`;
    s += `<circle cx="${x1}" cy="${yy}" r="${H * 0.0135}" fill="${INK}"/>`;
    s += `<text x="${pad}" y="${yy + fs * 0.34}" font-family="GS" font-size="${fs}" fill="${INK}">${name}</text>`;
  });
  // legend
  const ly = H - pad * 0.55;
  s += `<circle cx="${lineX0 + 8}" cy="${ly - mono * 0.35}" r="${H * 0.006}" fill="#f1f1ef" stroke="${INK}" stroke-width="1.6"/>`;
  s += `<text x="${lineX0 + 22}" y="${ly}" font-family="GM" font-size="${mono}" letter-spacing=".08em" fill="${INK}" opacity=".6">${tr('PREMIER JOUR', 'DAY ONE')}</text>`;
  const l2 = lineX0 + mono * 13;
  s += `<circle cx="${l2 + 8}" cy="${ly - mono * 0.35}" r="${H * 0.008}" fill="${INK}"/>`;
  s += `<text x="${l2 + 22}" y="${ly}" font-family="GM" font-size="${mono}" letter-spacing=".08em" fill="${INK}" opacity=".6">${tr('TROIS SEMAINES PLUS TARD', 'THREE WEEKS LATER')}</text>`;
  s += `</svg>`;
  S.innerHTML = h + s;
}

/* ── ÉLAN: one session, read in tint, word, figure ───────────────────────────────────────────── */
function elan() {
  const faces = [['../../public/elan/w/04-effort.webp', 'neutral'], ['../../public/elan/w/09-recup.webp', 'blue'], ['../../public/elan/w/05-vite.webp', 'pink']];
  const D = Math.min(H * 0.37, (W * 0.86) / 3.25);
  const gap = D * 0.12;
  const total = 3 * D + 2 * gap, x0 = (W - total) / 2, cy = H * 0.43;
  let h = '';
  faces.forEach(([src], i) => {
    h += `<div style="position:absolute;left:${x0 + i * (D + gap)}px;top:${cy - D / 2}px;width:${D}px;height:${D}px;border-radius:50%;overflow:hidden;box-shadow:0 ${D * 0.05}px ${D * 0.12}px -${D * 0.05}px rgba(0,0,0,.35)"><img src="${src}" style="width:100%;height:100%;display:block"></div>`;
  });
  // the session underneath: 8 efforts of 400 m, a minute of recovery between them; the 4th is the one on the faces
  const ty = H * 0.8, tx0 = W * 0.08, tx1 = W * 0.92;
  const n = 8, e = 1, r = 0.55, unit = (tx1 - tx0) / (n * e + (n - 1) * r);
  const C = { effort: '#8d9097', recup: '#7686ad', vite: '#c4868f' };
  let s = `<svg width="${W}" height="${H}" style="position:absolute;inset:0">`;
  const bh = H * 0.016, mono = H * 0.0118;
  let x = tx0;
  for (let i = 0; i < n; i++) {
    const w = e * unit;
    if (i === 3) {
      s += `<rect x="${x}" y="${ty - bh / 2}" width="${w * 0.62}" height="${bh}" fill="${C.effort}"/>`;
      s += `<rect x="${x + w * 0.62}" y="${ty - bh / 2}" width="${w * 0.38}" height="${bh}" fill="${C.vite}"/>`;
      s += `<path d="M ${x + w / 2} ${ty - bh / 2 - 10} l -7 -10 h 14 z" fill="${INK}"/>`;
      s += `<text x="${x + w / 2}" y="${ty - bh / 2 - 30}" text-anchor="middle" font-family="GM" font-size="${mono}" letter-spacing=".08em" fill="${INK}">4/8</text>`;
    } else {
      s += `<rect x="${x}" y="${ty - bh / 2}" width="${w}" height="${bh}" fill="${C.effort}" opacity="${i < 3 ? 1 : 0.35}"/>`;
    }
    x += w;
    if (i < n - 1) {
      s += `<rect x="${x + 3}" y="${ty - bh / 2}" width="${r * unit - 6}" height="${bh}" fill="${C.recup}" opacity="${i < 3 ? 1 : 0.35}"/>`;
      x += r * unit;
    }
  }
  s += `<text x="${tx0}" y="${ty + bh + mono * 1.7}" font-family="GM" font-size="${mono}" letter-spacing=".08em" fill="${INK}" opacity=".65">${tr('EFFORT · 400 M', 'EFFORT · 400 M')}</text>`;
  s += `<text x="${tx0 + unit * (e + r * 0.5)}" y="${ty + bh + mono * 3.3}" text-anchor="middle" font-family="GM" font-size="${mono}" letter-spacing=".08em" fill="${INK}" opacity=".65">${tr('RÉCUPÉRATION · 1:00', 'RECOVERY · 1:00')}</text>`;
  s += `</svg>`;
  S.innerHTML = h + s;
}

({ colosse, proxy, elan })[ID]();
document.fonts.ready.then(() => Promise.all([...document.images].map((i) => (i.complete ? 1 : new Promise((r) => (i.onload = i.onerror = r)))))).then(() => (window.__ready = true));
</script>
</body>
</html>
