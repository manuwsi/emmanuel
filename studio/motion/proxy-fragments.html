<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#e9e9e7;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
/* Proxy — the pieces of a day. Everything the agent did floats as loose fragments,
   gathers into one pile, and the pile becomes the journal. Then it comes apart again. */
window.T = 10;
const F = [
  // key, display width, cluster x, y (top-left)
  ['journal', 860, 470, 70],
  ['check', 600, 1230, 120],
  ['ask', 560, 70, 330],
  ['why', 300, 660, 330],
  ['fix', 320, 1000, 400],
  ['compare', 640, 1250, 470],
  ['steps', 700, 180, 700],
  ['learn', 560, 930, 760],
  ['scope', 520, 1360, 790],
];
let imgs = [], full;
const PW = 640;

window.setup = async () => {
  imgs = await loadAll(F.map((f) => `pub/proxy/z-${f[0]}-hd.webp`));
  full = await load('pub/proxy/03-journal-hd.webp');
};

function card(img, x, y, w, rot = 0, a = 1) {
  const h = (w * img.naturalHeight) / img.naturalWidth;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(10,10,10,0.09)'; ctx.fillRect(-w / 2 - 1, -h / 2 - 1, w + 2, h + 2);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}

window.draw = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#e9e9e7'; ctx.fillRect(0, 0, W, H);
  dotField(ctx, 'rgba(10,10,10,0.10)', 40, 1.5);

  const gather = eio5(prog(t, 2.5, 3.8)) * (1 - eio5(prog(t, 8.0, 9.5)));
  const ph = (t / T) * Math.PI * 2;

  F.forEach((f, i) => {
    const img = imgs[i];
    const [, w, cx, cy] = f;
    // loose: slow drift around the cluster position
    const dx = Math.sin(ph + i * 1.7) * 14, dy = Math.cos(ph * 1 + i * 2.3) * 10;
    const rot0 = Math.sin(ph + i) * 0.006;
    const lw = w, lx = cx + dx, ly = cy + dy;
    // pile: all the same width, stacked in the middle
    const ph2 = (PW * img.naturalHeight) / img.naturalWidth;
    const px = W / 2 - PW / 2 + (i - 4) * 3, py = H / 2 - ph2 / 2 + (i - 4) * 5;
    // stagger: each piece leaves a bit after the previous one
    const g = clamp(gather * 1.35 - (i / F.length) * 0.35);
    const k = g;
    card(img, lerp(lx, px, k), lerp(ly, py, k), lerp(lw, PW, k), lerp(rot0, 0, k));
  });

  // the pile becomes the journal
  const p = eio(prog(t, 3.75, 5.0)) * (1 - eio(prog(t, 7.0, 8.1)));
  if (p > 0) {
    const zw = 1360, zh = 850, zx = (W - zw) / 2, zy = (H - zh) / 2;
    const z = 1 + 0.015 * prog(t, 5.0, 7.0);
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    if (p > 0.5) { ctx.fillStyle = `rgba(10,10,10,${0.09 * sm(0.5, 1, p)})`; ctx.fillRect(zx - 1, zy - 1, zw + 2, zh + 2); }
    bloom(ctx, full, zx, zy, zw, zh, p, { origin: [0.5, 0.5], cell: 12, spread: 1.4, band: 0.3 });
    ctx.restore();
  }
};
</script></body></html>
